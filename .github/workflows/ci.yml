# ============================================================================
# NoblePay CI Pipeline
# ============================================================================
# Branch protection rules (apply via Settings > Branches > main):
#   - Require status checks to pass before merging:
#       * backend
#       * frontend
#       * contracts
#       * gateway
#       * compliance
#       * containers
#       * security-gate
#   - Require branches to be up to date before merging
#   - Require pull request reviews before merging (minimum 1)
#   - Do not allow bypassing the above settings
# ============================================================================

name: NoblePay CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job: backend — Node.js API with Prisma, lint, tests, coverage enforcement
# ---------------------------------------------------------------------------
jobs:
  backend:
    name: Backend API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_USER: noblepay
          POSTGRES_PASSWORD: noblepay_ci
          POSTGRES_DB: noblepay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://noblepay:noblepay_ci@localhost:5432/noblepay
      SHADOW_DATABASE_URL: postgresql://noblepay:noblepay_ci@localhost:5432/noblepay_shadow

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create shadow database
        run: PGPASSWORD=noblepay_ci psql -h localhost -U noblepay -d noblepay -c "CREATE DATABASE noblepay_shadow;"

      - name: Setup Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit complete dependency graph
        run: npx --no-install audit-ci --config ../audit-ci.jsonc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy migration to CI database
        run: npx prisma migrate deploy

      - name: Check migration status
        run: npx prisma migrate status

      - name: Check schema drift
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: |
          npx jest --runInBand --forceExit --detectOpenHandles --coverage \
            --coverageReporters=text --coverageReporters=json-summary --coverageReporters=lcov

      - name: Enforce security-critical module coverage (>= 80%)
        run: |
          echo "Checking coverage for security-critical modules..."

          CRITICAL_MODULES=(
            "src/middleware/auth"
            "src/middleware/rbac"
            "src/services/treasury"
            "src/services/payment"
            "src/services/compliance"
            "src/routes/payments"
            "src/routes/treasury"
          )

          COVERAGE_FILE="coverage/coverage-summary.json"

          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "::error::Coverage summary not found at $COVERAGE_FILE"
            exit 1
          fi

          FAILED=0

          for MODULE in "${CRITICAL_MODULES[@]}"; do
            # Find matching keys in coverage JSON (file paths contain the module path)
            MATCHING_FILES=$(node -e "
              const cov = require('./${COVERAGE_FILE}');
              const matches = Object.keys(cov).filter(k => k !== 'total' && k.includes('${MODULE}'));
              if (matches.length === 0) {
                console.log('MISSING');
              } else {
                let totalStatements = 0, coveredStatements = 0;
                let totalBranches = 0, coveredBranches = 0;
                let totalFunctions = 0, coveredFunctions = 0;
                let totalLines = 0, coveredLines = 0;
                for (const m of matches) {
                  totalStatements += cov[m].statements.total;
                  coveredStatements += cov[m].statements.covered;
                  totalBranches += cov[m].branches.total;
                  coveredBranches += cov[m].branches.covered;
                  totalFunctions += cov[m].functions.total;
                  coveredFunctions += cov[m].functions.covered;
                  totalLines += cov[m].lines.total;
                  coveredLines += cov[m].lines.covered;
                }
                const stmtPct = totalStatements > 0 ? (coveredStatements / totalStatements * 100).toFixed(2) : 100;
                const brPct = totalBranches > 0 ? (coveredBranches / totalBranches * 100).toFixed(2) : 100;
                const fnPct = totalFunctions > 0 ? (coveredFunctions / totalFunctions * 100).toFixed(2) : 100;
                const lnPct = totalLines > 0 ? (coveredLines / totalLines * 100).toFixed(2) : 100;
                console.log(stmtPct + '|' + brPct + '|' + fnPct + '|' + lnPct);
              }
            ")

            if [ "$MATCHING_FILES" = "MISSING" ]; then
              echo "::error::${MODULE} has no coverage data"
              FAILED=1
              continue
            fi

            IFS='|' read -r STMT_PCT BR_PCT FN_PCT LN_PCT <<< "$MATCHING_FILES"
            THRESHOLD=80

            echo "  ${MODULE}:"
            echo "    statements=${STMT_PCT}% branches=${BR_PCT}% functions=${FN_PCT}% lines=${LN_PCT}%"

            for METRIC_NAME in STMT_PCT BR_PCT FN_PCT LN_PCT; do
              METRIC_VAL=${!METRIC_NAME}
              BELOW=$(node -e "console.log(parseFloat('${METRIC_VAL}') < ${THRESHOLD} ? 'yes' : 'no')")
              if [ "$BELOW" = "yes" ]; then
                echo "::error::${MODULE} ${METRIC_NAME} coverage is ${METRIC_VAL}% (threshold: ${THRESHOLD}%)"
                FAILED=1
              fi
            done
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::Security-critical module coverage below ${THRESHOLD}% threshold. Fix coverage before merging."
            exit 1
          fi

          echo ""
          echo "All security-critical modules meet the ${THRESHOLD}% coverage threshold."

  # ---------------------------------------------------------------------------
  # Job: frontend — Next.js build, lint, type-check, and tests
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_CHAIN_ENV: "testnet"
      NEXT_PUBLIC_AETHELRED_CHAIN_ID: "7332"
      NEXT_PUBLIC_AETHELRED_NETWORK_ANCHOR_BLOCK: "1"
      NEXT_PUBLIC_AETHELRED_NETWORK_ANCHOR_HASH: "0xabababababababababababababababababababababababababababababababab"
      NEXT_PUBLIC_AETHELRED_RPC_URL: "https://public-rpc.operator.example.com"
      NEXT_PUBLIC_AETHELRED_WS_URL: "wss://public-ws.operator.example.com"
      NEXT_PUBLIC_AETHELRED_EXPLORER_URL: "https://explorer.operator.example.com"
      NEXT_PUBLIC_NOBLEPAY_ADDRESS: "0x1111111111111111111111111111111111111111"
      NEXT_PUBLIC_BUSINESS_REGISTRY_ADDRESS: "0x2222222222222222222222222222222222222222"
      NEXT_PUBLIC_COMPLIANCE_ORACLE_ADDRESS: "0x3333333333333333333333333333333333333333"
      NEXT_PUBLIC_TRAVEL_RULE_ADDRESS: "0x4444444444444444444444444444444444444444"
      NEXT_PUBLIC_PAYMENT_CHANNELS_ADDRESS: "0x5555555555555555555555555555555555555555"
      NEXT_PUBLIC_USDC_TOKEN_ADDRESS: "0x6666666666666666666666666666666666666666"
      NEXT_PUBLIC_USDT_TOKEN_ADDRESS: "0x7777777777777777777777777777777777777777"
      NEXT_PUBLIC_SITE_URL: "https://noblepay-ci.example.com"
      NEXT_PUBLIC_API_URL: "https://noblepay-ci.example.com/api"
      NEXT_PUBLIC_WS_URL: "wss://noblepay-ci.example.com/ws"
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: "0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_APP_VERSION: "1.0.0-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit complete dependency graph
        run: npx --no-install audit-ci --config audit-ci.jsonc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser smoke tests
        run: npm run test:e2e

      - name: Run tests
        run: npm run test:ci

  # ---------------------------------------------------------------------------
  # Job: contracts — Hardhat compile, test, and exploit simulation
  # ---------------------------------------------------------------------------
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit complete dependency graph
        run: npx --no-install audit-ci --config ../audit-ci.jsonc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Clean and compile contracts
        run: npx hardhat clean && npx hardhat compile

      - name: Verify deployment artifacts against source and compiler settings
        run: node ../scripts/deploy-devnet-core.mjs --verify-artifacts

      - name: Verify two-phase governance handoff invariants
        run: node ../scripts/test-deployment-governance.mjs

      - name: Run contract tests
        run: npx hardhat test

      - name: Run exploit simulation tests
        run: npx hardhat test test/ExploitSimulations.test.js

      - name: Validate deterministic deployment script syntax
        run: node --check ../scripts/deploy-devnet-core.mjs

  # ---------------------------------------------------------------------------
  # Job: gateway — Go API gateway with race detection
  # ---------------------------------------------------------------------------
  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.12"
          cache-dependency-path: services/gateway/go.sum

      - name: Download dependencies
        run: go mod download && go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test ./... -v -race -count=1 -timeout 300s

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # Job: compliance — local/test Rust compliance reference
  # ---------------------------------------------------------------------------
  compliance:
    name: Compliance Reference (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/noblepay-compliance

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust 1.90.0 with lint and formatting components
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action snapshot
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/noblepay-compliance/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/noblepay-compliance/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Enforce Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets and features, no warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests (all features)
        run: cargo test --locked --all-features

      - name: Run tests (production feature boundary)
        run: cargo test --locked --no-default-features

      - name: Run documentation tests
        run: cargo test --locked --doc --all-features

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

  # ---------------------------------------------------------------------------
  # Job: containers — production Dockerfiles and Compose rendering
  # ---------------------------------------------------------------------------
  containers:
    name: Production Containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend, gateway, compliance]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Compose configuration
        run: docker compose --env-file deploy/production.env.example -f compose.production.yml config --quiet

      - name: Validate unprivileged Nginx configuration
        run: >-
          docker run --rm
          --add-host frontend:127.0.0.1
          --add-host backend:127.0.0.1
          --volume "${PWD}/deploy/nginx/noblepay.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:1.30.4-alpine3.24
          nginx -t

      - name: Validate production routing and fail-closed configuration
        env:
          API_KEY_HASH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          COMPLIANCE_API_URL: https://compliance.vendor.com
          COMPLIANCE_MAX_DATASET_AGE_HOURS: "24"
          TRAVEL_RULE_THRESHOLD_USD: "3000"
          TRAVEL_RULE_ACTIVE_KEY_ID: ci-key
          TRAVEL_RULE_ENCRYPTION_KEYS: '{"ci-key":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          NOBLEPAY_CHAIN_ID: "7332"
          NEXT_PUBLIC_AETHELRED_CHAIN_ID: "7332"
          AETHELRED_NETWORK_ANCHOR_BLOCK: "1"
          AETHELRED_NETWORK_ANCHOR_HASH: "0xabababababababababababababababababababababababababababababababab"
          BUSINESS_VERIFIER_ADDRESS: "0x4444444444444444444444444444444444444444"
          NEXT_PUBLIC_AETHELRED_NETWORK_ANCHOR_BLOCK: "1"
          NEXT_PUBLIC_AETHELRED_NETWORK_ANCHOR_HASH: "0xabababababababababababababababababababababababababababababababab"
          PUBLIC_AETHELRED_RPC_URL: https://public-rpc.operator.example.com
          PUBLIC_AETHELRED_WS_URL: wss://public-ws.operator.example.com
          PUBLIC_AETHELRED_EXPLORER_URL: https://explorer.operator.example.com
          PUBLIC_ORIGIN: https://noblepay-ci.example.com
        run: node scripts/validate-production-config.mjs

      - name: Validate frontend production environment and CSP
        run: node scripts/test-next-production-config.mjs

      - name: Build backend image
        run: docker build --pull --file deploy/docker/backend.Dockerfile --tag noblepay-backend:ci .

      - name: Build frontend image
        run: >-
          docker build --pull --file deploy/docker/frontend.Dockerfile --tag noblepay-frontend:ci
          --build-arg NEXT_PUBLIC_CHAIN_ENV=testnet
          --build-arg NEXT_PUBLIC_AETHELRED_CHAIN_ID=7332
          --build-arg NEXT_PUBLIC_AETHELRED_NETWORK_ANCHOR_BLOCK=1
          --build-arg NEXT_PUBLIC_AETHELRED_NETWORK_ANCHOR_HASH=0xabababababababababababababababababababababababababababababababab
          --build-arg NEXT_PUBLIC_AETHELRED_RPC_URL=https://public-rpc.operator.example.com
          --build-arg NEXT_PUBLIC_AETHELRED_WS_URL=wss://public-ws.operator.example.com
          --build-arg NEXT_PUBLIC_AETHELRED_EXPLORER_URL=https://explorer.operator.example.com
          --build-arg NEXT_PUBLIC_NOBLEPAY_ADDRESS=0x1111111111111111111111111111111111111111
          --build-arg NEXT_PUBLIC_BUSINESS_REGISTRY_ADDRESS=0x2222222222222222222222222222222222222222
          --build-arg NEXT_PUBLIC_COMPLIANCE_ORACLE_ADDRESS=0x3333333333333333333333333333333333333333
          --build-arg NEXT_PUBLIC_TRAVEL_RULE_ADDRESS=0x4444444444444444444444444444444444444444
          --build-arg NEXT_PUBLIC_PAYMENT_CHANNELS_ADDRESS=0x5555555555555555555555555555555555555555
          --build-arg NEXT_PUBLIC_SITE_URL=https://noblepay-ci.example.com
          --build-arg NEXT_PUBLIC_API_URL=https://noblepay-ci.example.com/api
          --build-arg NEXT_PUBLIC_WS_URL=wss://noblepay-ci.example.com/ws
          --build-arg NEXT_PUBLIC_USDC_TOKEN_ADDRESS=0x6666666666666666666666666666666666666666
          --build-arg NEXT_PUBLIC_USDT_TOKEN_ADDRESS=0x7777777777777777777777777777777777777777
          --build-arg NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=0123456789abcdef0123456789abcdef
          --build-arg NEXT_PUBLIC_APP_VERSION=1.0.0-ci
          .

      - name: Build gateway image
        run: docker build --pull --file deploy/docker/gateway.Dockerfile --tag noblepay-gateway:ci .

      - name: Create container security evidence directory
        run: mkdir -p security-results

      - name: Scan backend image for high and critical vulnerabilities
        id: trivy_backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: noblepay-backend:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          limit-severities-for-sarif: true
          format: sarif
          output: security-results/backend.sarif
          exit-code: "1"
          timeout: 10m

      - name: Generate backend image CycloneDX SBOM
        id: sbom_backend
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          cache: false
          scan-type: image
          image-ref: noblepay-backend:ci
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: true
          format: cyclonedx
          output: security-results/backend.cdx.json
          exit-code: "0"
          timeout: 10m

      - name: Scan frontend image for high and critical vulnerabilities
        id: trivy_frontend
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          cache: false
          scan-type: image
          image-ref: noblepay-frontend:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          limit-severities-for-sarif: true
          format: sarif
          output: security-results/frontend.sarif
          exit-code: "1"
          timeout: 10m

      - name: Generate frontend image CycloneDX SBOM
        id: sbom_frontend
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          cache: false
          scan-type: image
          image-ref: noblepay-frontend:ci
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: true
          format: cyclonedx
          output: security-results/frontend.cdx.json
          exit-code: "0"
          timeout: 10m

      - name: Scan gateway image for high and critical vulnerabilities
        id: trivy_gateway
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          cache: false
          scan-type: image
          image-ref: noblepay-gateway:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          limit-severities-for-sarif: true
          format: sarif
          output: security-results/gateway.sarif
          exit-code: "1"
          timeout: 10m

      - name: Generate gateway image CycloneDX SBOM
        id: sbom_gateway
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          cache: false
          scan-type: image
          image-ref: noblepay-gateway:ci
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: true
          format: cyclonedx
          output: security-results/gateway.cdx.json
          exit-code: "0"
          timeout: 10m

      - name: Validate container security evidence
        id: validate_container_evidence
        if: always()
        run: |
          set -euo pipefail
          for report in \
            security-results/backend.sarif \
            security-results/frontend.sarif \
            security-results/gateway.sarif
          do
            test -s "$report"
            jq -e '.version == "2.1.0" and (.runs | type == "array")' "$report" >/dev/null
          done
          for sbom in \
            security-results/backend.cdx.json \
            security-results/frontend.cdx.json \
            security-results/gateway.cdx.json
          do
            test -s "$sbom"
            jq -e '.bomFormat == "CycloneDX" and (.components | type == "array")' "$sbom" >/dev/null
          done

      - name: Upload backend Trivy SARIF
        if: >-
          always() &&
          hashFiles('security-results/backend.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: security-results/backend.sarif
          category: trivy-noblepay-backend

      - name: Upload frontend Trivy SARIF
        if: >-
          always() &&
          hashFiles('security-results/frontend.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: security-results/frontend.sarif
          category: trivy-noblepay-frontend

      - name: Upload gateway Trivy SARIF
        if: >-
          always() &&
          hashFiles('security-results/gateway.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: security-results/gateway.sarif
          category: trivy-noblepay-gateway

      - name: Upload container SARIF and SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noblepay-container-security-${{ github.sha }}-${{ github.run_attempt }}
          path: security-results/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce container supply-chain gate
        if: always()
        env:
          BACKEND_SCAN: ${{ steps.trivy_backend.outcome }}
          BACKEND_SBOM: ${{ steps.sbom_backend.outcome }}
          FRONTEND_SCAN: ${{ steps.trivy_frontend.outcome }}
          FRONTEND_SBOM: ${{ steps.sbom_frontend.outcome }}
          GATEWAY_SCAN: ${{ steps.trivy_gateway.outcome }}
          GATEWAY_SBOM: ${{ steps.sbom_gateway.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "$BACKEND_SCAN" \
            "$BACKEND_SBOM" \
            "$FRONTEND_SCAN" \
            "$FRONTEND_SBOM" \
            "$GATEWAY_SCAN" \
            "$GATEWAY_SBOM"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::A final NoblePay image contains a HIGH/CRITICAL vulnerability or its SBOM could not be generated."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job: security-gate — Final gate ensuring all CI jobs passed
  # ---------------------------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, frontend, contracts, gateway, compliance, containers]
    if: always()

    steps:
      - name: Evaluate job results
        run: |
          echo "============================================"
          echo "  NoblePay CI Security Gate"
          echo "============================================"
          echo ""
          echo "Job Results:"
          echo "  backend:    ${{ needs.backend.result }}"
          echo "  frontend:   ${{ needs.frontend.result }}"
          echo "  contracts:  ${{ needs.contracts.result }}"
          echo "  gateway:    ${{ needs.gateway.result }}"
          echo "  compliance: ${{ needs.compliance.result }}"
          echo "  containers: ${{ needs.containers.result }}"
          echo ""

          if [[ "${{ needs.backend.result }}" != "success" || \
                "${{ needs.frontend.result }}" != "success" || \
                "${{ needs.contracts.result }}" != "success" || \
                "${{ needs.gateway.result }}" != "success" || \
                "${{ needs.compliance.result }}" != "success" || \
                "${{ needs.containers.result }}" != "success" ]]; then
            echo "::error::One or more required CI jobs failed. All jobs must pass before merge."
            exit 1
          fi

          echo "All CI jobs passed. Merge is allowed."
