name: noblepay

services:
  postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      target: migration
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]
    security_opt: [no-new-privileges:true]

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4008"
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:?set API_KEY_HASH_SECRET}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      AETHELRED_RPC_URL: ${AETHELRED_RPC_URL:?set AETHELRED_RPC_URL}
      NOBLEPAY_CHAIN_ID: ${NOBLEPAY_CHAIN_ID:?set NOBLEPAY_CHAIN_ID}
      AETHELRED_NETWORK_ANCHOR_BLOCK: ${AETHELRED_NETWORK_ANCHOR_BLOCK:?set AETHELRED_NETWORK_ANCHOR_BLOCK}
      AETHELRED_NETWORK_ANCHOR_HASH: ${AETHELRED_NETWORK_ANCHOR_HASH:?set AETHELRED_NETWORK_ANCHOR_HASH}
      NOBLEPAY_CONTRACT_ADDRESS: ${NOBLEPAY_CONTRACT_ADDRESS:?set NOBLEPAY_CONTRACT_ADDRESS}
      BUSINESS_REGISTRY_CONTRACT_ADDRESS: ${BUSINESS_REGISTRY_CONTRACT_ADDRESS:?set BUSINESS_REGISTRY_CONTRACT_ADDRESS}
      BUSINESS_VERIFIER_ADDRESS: ${BUSINESS_VERIFIER_ADDRESS:?set BUSINESS_VERIFIER_ADDRESS}
      NOBLEPAY_MIN_CONFIRMATIONS: ${NOBLEPAY_MIN_CONFIRMATIONS:?set NOBLEPAY_MIN_CONFIRMATIONS}
      NOBLEPAY_TOKEN_CONFIG: ${NOBLEPAY_TOKEN_CONFIG:?set NOBLEPAY_TOKEN_CONFIG}
      COMPLIANCE_API_URL: ${COMPLIANCE_API_URL:?set COMPLIANCE_API_URL}
      COMPLIANCE_API_KEY: ${COMPLIANCE_API_KEY:?set COMPLIANCE_API_KEY}
      COMPLIANCE_MAX_DATASET_AGE_HOURS: ${COMPLIANCE_MAX_DATASET_AGE_HOURS:?set COMPLIANCE_MAX_DATASET_AGE_HOURS}
      TRAVEL_RULE_THRESHOLD_USD: ${TRAVEL_RULE_THRESHOLD_USD:?set TRAVEL_RULE_THRESHOLD_USD}
      TRAVEL_RULE_ACTIVE_KEY_ID: ${TRAVEL_RULE_ACTIVE_KEY_ID:?set TRAVEL_RULE_ACTIVE_KEY_ID}
      TRAVEL_RULE_ENCRYPTION_KEYS: ${TRAVEL_RULE_ENCRYPTION_KEYS:?set TRAVEL_RULE_ENCRYPTION_KEYS}
      REGULATORY_REPORTING_URL: ${REGULATORY_REPORTING_URL:-}
      REGULATORY_REPORTING_API_KEY: ${REGULATORY_REPORTING_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: "false"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:4008:4008"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [private, public]

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_CHAIN_ENV: ${NEXT_PUBLIC_CHAIN_ENV:?set NEXT_PUBLIC_CHAIN_ENV}
        NEXT_PUBLIC_AETHELRED_CHAIN_ID: ${NOBLEPAY_CHAIN_ID:?set NOBLEPAY_CHAIN_ID}
        NEXT_PUBLIC_AETHELRED_NETWORK_ANCHOR_BLOCK: ${AETHELRED_NETWORK_ANCHOR_BLOCK:?set AETHELRED_NETWORK_ANCHOR_BLOCK}
        NEXT_PUBLIC_AETHELRED_NETWORK_ANCHOR_HASH: ${AETHELRED_NETWORK_ANCHOR_HASH:?set AETHELRED_NETWORK_ANCHOR_HASH}
        NEXT_PUBLIC_AETHELRED_RPC_URL: ${PUBLIC_AETHELRED_RPC_URL:?set PUBLIC_AETHELRED_RPC_URL}
        NEXT_PUBLIC_AETHELRED_WS_URL: ${PUBLIC_AETHELRED_WS_URL:?set PUBLIC_AETHELRED_WS_URL}
        NEXT_PUBLIC_AETHELRED_EXPLORER_URL: ${PUBLIC_AETHELRED_EXPLORER_URL:?set PUBLIC_AETHELRED_EXPLORER_URL}
        NEXT_PUBLIC_NOBLEPAY_ADDRESS: ${NOBLEPAY_CONTRACT_ADDRESS:?set NOBLEPAY_CONTRACT_ADDRESS}
        NEXT_PUBLIC_BUSINESS_REGISTRY_ADDRESS: ${BUSINESS_REGISTRY_CONTRACT_ADDRESS:?set BUSINESS_REGISTRY_CONTRACT_ADDRESS}
        NEXT_PUBLIC_PAYMENT_CHANNELS_ADDRESS: ${PAYMENT_CHANNELS_ADDRESS:?set PAYMENT_CHANNELS_ADDRESS}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_USDC_TOKEN_ADDRESS: ${USDC_TOKEN_ADDRESS:?set USDC_TOKEN_ADDRESS}
        NEXT_PUBLIC_USDT_TOKEN_ADDRESS: ${USDT_TOKEN_ADDRESS:?set USDT_TOKEN_ADDRESS}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:?set WALLETCONNECT_PROJECT_ID}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:?set NEXT_PUBLIC_APP_VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3008"
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3008:3008"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: [no-new-privileges:true]
    networks: [public]

  gateway:
    profiles: [gateway]
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      GATEWAY_PORT: "4018"
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      COMPLIANCE_API_URL: ${COMPLIANCE_API_URL:?set COMPLIANCE_API_URL}
      COMPLIANCE_API_KEY: ${COMPLIANCE_API_KEY:?set COMPLIANCE_API_KEY}
      COMPLIANCE_MAX_DATASET_AGE_HOURS: ${COMPLIANCE_MAX_DATASET_AGE_HOURS:?set COMPLIANCE_MAX_DATASET_AGE_HOURS}
      COMPLIANCE_TIMEOUT_SECS: ${COMPLIANCE_TIMEOUT_SECS:-5}
      CHAIN_RPC_URL: ${AETHELRED_RPC_URL:?set AETHELRED_RPC_URL}
      NOBLEPAY_CHAIN_ID: ${NOBLEPAY_CHAIN_ID:?set NOBLEPAY_CHAIN_ID}
      AETHELRED_NETWORK_ANCHOR_BLOCK: ${AETHELRED_NETWORK_ANCHOR_BLOCK:?set AETHELRED_NETWORK_ANCHOR_BLOCK}
      AETHELRED_NETWORK_ANCHOR_HASH: ${AETHELRED_NETWORK_ANCHOR_HASH:?set AETHELRED_NETWORK_ANCHOR_HASH}
      NOBLEPAY_CONTRACT_ADDRESS: ${NOBLEPAY_CONTRACT_ADDRESS:?set NOBLEPAY_CONTRACT_ADDRESS}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-2}
      INDEXER_POLL_INTERVAL_SECS: ${INDEXER_POLL_INTERVAL_SECS:-10}
      TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:-}
      STORE_PATH: /var/lib/noblepay-gateway/store.json
    volumes:
      - gateway-data:/var/lib/noblepay-gateway
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:4018:4018"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [private, public]

  proxy:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine3.24
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/noblepay.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTP_PORT:-8080}:8080"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: [no-new-privileges:true]
    networks: [public]
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  postgres-data:
  gateway-data:

networks:
  private:
    internal: true
  public:
