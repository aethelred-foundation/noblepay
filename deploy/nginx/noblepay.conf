map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Bound concurrent upgraded sockets per client IP. Twenty connections leaves
# room for normal multi-tab/NAT use while containing connection-flood abuse.
limit_conn_zone $binary_remote_addr zone=noblepay_ws_per_ip:10m;

upstream noblepay_frontend {
    server frontend:3008;
    keepalive 32;
}

upstream noblepay_backend {
    server backend:4008;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # Operational endpoints are consumed only on the host/private network.
    # Cover both canonical and trailing-slash forms before the public proxy;
    # Express does not enable strict routing, so exact locations alone would
    # leave the slash variants reachable.
    location ~ ^/api/(?:metrics|health|healthz|readyz)/?$ { return 404; }

    location /api/ {
        # The trailing slash strips /api/ because Express mounts routes at /v1/.
        proxy_pass http://noblepay_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /ws {
        limit_conn noblepay_ws_per_ip 20;
        limit_conn_status 429;
        proxy_pass http://noblepay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    location / {
        proxy_pass http://noblepay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
